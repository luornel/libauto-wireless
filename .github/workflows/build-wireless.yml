name: Build LibAuto Wireless Test

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/native-aa-bootstrap ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Checkout LibAuto upstream
        uses: actions/checkout@v4
        with:
          repository: stf-ftw/LibAuto
          path: LibAuto

      - name: Expose experimental Wireless Android Auto card
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("LibAuto/app/src/main/res/layout/activity_main.xml")
          s = p.read_text()
          pat = r'(<LinearLayout\s+android:id="@\+id/wireless_card"[\s\S]*?)(android:visibility=")gone(")'
          s2, n = re.subn(pat, r'\1\2visible\3', s, count=1)
          if n != 1:
              raise SystemExit("Could not find hidden wireless_card")
          gradle = Path("LibAuto/app/build.gradle")
          g = gradle.read_text()
          abi_pat = r'abiFilters\s+"armeabi-v7a",\s*"arm64-v8a"'
          g2, n2 = re.subn(abi_pat, 'abiFilters "armeabi-v7a"', g, count=1)
          if n2 != 1:
              raise SystemExit("Could not narrow ABI filters for CI build")
          service = Path("LibAuto/app/src/main/java/com/example/androidautodisplay/ProjectionService.kt")
          ps = service.read_text()
          needle = '            LogFileHelper.appendEvent(this, "WirelessAa", message)'
          replacement = needle + '\n            sendBroadcast(Intent(Constants.ACTION_WIRELESS_STATUS).apply { putExtra(Constants.EXTRA_STATUS, "diagnostic"); putExtra(Constants.EXTRA_WIRELESS_DETAILS, message) })'
          if needle not in ps:
              raise SystemExit("Could not find WirelessAa logger")
          service.write_text(ps.replace(needle, replacement, 1))
          main = Path("LibAuto/app/src/main/java/com/example/androidautodisplay/MainActivity.kt")
          ms = main.read_text()
          old = '                    wirelessStatusText.text = details'
          new = '                    if (status == "diagnostic") { val previous = wirelessStatusText.text.toString(); val lines = (previous.lines() + details).filter { it.isNotBlank() }.takeLast(8); wirelessStatusText.text = lines.joinToString("\\n") } else { wirelessStatusText.text = details }'
          if old not in ms:
              raise SystemExit("Could not find wireless status UI")
          main.write_text(ms.replace(old, new, 1))
          controller = Path("LibAuto/app/src/main/java/com/example/androidautodisplay/WirelessAaController.kt")
          wc = controller.read_text()
          old_ble = '        if (startBleGattServer()) {\n            startBleAdvertising(adapter)\n        } else {\n            bleAdvertiseBroken = true\n            logger("Wireless BLE advertise skipped: GATT server unavailable")\n        }'
          new_ble = '        logger("Native AA bootstrap: classic Bluetooth SDP/RFCOMM mode; BLE advertising disabled")'
          if old_ble not in wc:
              raise SystemExit("Could not find BLE bootstrap block")
          wc = wc.replace(old_ble, new_ble, 1)
          old_loop = '        for (endpoint in AA_WIRELESS_ENDPOINTS) {\n            val worker = Thread({\n                listenForBluetoothClient(adapter, endpoint, ssid, password, bssid, port, dynamicAp)\n            }, "LibAuto-WirelessBootstrap-\${endpoint.label}")\n            workers += worker\n            worker.start()\n        }\n        startOutboundBluetoothBootstrap(adapter, ssid, password, bssid, port, dynamicAp)'
          new_loop = '        val endpoint = AA_WIRELESS_ENDPOINTS.first { it.label == "openauto-secure" }\n        logger("Native AA bootstrap: canonical SDP service active; waiting for phone-initiated RFCOMM")\n        val worker = Thread({ listenForBluetoothClient(adapter, endpoint, ssid, password, bssid, port, dynamicAp) }, "LibAuto-NativeAaBootstrap")\n        workers += worker\n        worker.start()'
          if old_loop not in wc:
              raise SystemExit("Could not find RFCOMM bootstrap block")
          wc = wc.replace(old_loop, new_loop, 1)
          controller.write_text(wc)
          p.write_text(s2)
          gradle.write_text(g2)
          print("Wireless card exposed; 32-bit ABI selected; diagnostics enabled.")

      - name: Verify generated Kotlin patch
        run: |
          echo "=== MainActivity wireless diagnostics patch ==="
          grep -n -A4 -B4 'status == "diagnostic"' LibAuto/app/src/main/java/com/example/androidautodisplay/MainActivity.kt
          echo "=== Native AA bootstrap patch ==="
          grep -n -A8 -B4 'Native AA bootstrap' LibAuto/app/src/main/java/com/example/androidautodisplay/WirelessAaController.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          ls -la "$ANDROID_HOME" || true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Bootstrap vcpkg
        working-directory: LibAuto
        run: |
          mkdir -p third_party
          git clone https://github.com/microsoft/vcpkg.git third_party/vcpkg
          ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-armv7-${{ runner.os }}-${{ hashFiles('LibAuto/native/vcpkg.json') }}
          restore-keys: |
            vcpkg-android-armv7-${{ runner.os }}-

      - name: Build installable compatibility debug APK
        working-directory: LibAuto
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          mkdir -p "$HOME/.cache/vcpkg/archives" "$VCPKG_DEFAULT_BINARY_CACHE"
          export VCPKG_BINARY_SOURCES="clear;files,$HOME/.cache/vcpkg/archives,readwrite"
          chmod +x gradlew
          ./gradlew assembleCompatibilityDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          APK=$(find LibAuto/app/build/outputs/apk/compatibility/debug -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" output/LibAuto-wireless-test.apk
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibAuto-wireless-test
          path: output/LibAuto-wireless-test.apk
          if-no-files-found: error
