name: Build LibAuto Wireless Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Checkout LibAuto upstream
        uses: actions/checkout@v4
        with:
          repository: stf-ftw/LibAuto
          path: LibAuto

      - name: Expose experimental Wireless Android Auto card
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("LibAuto/app/src/main/res/layout/activity_main.xml")
          s = p.read_text()
          pat = r'(<LinearLayout\s+android:id="@\+id/wireless_card"[\s\S]*?)(android:visibility=")gone(")'
          s2, n = re.subn(pat, r'\1\2visible\3', s, count=1)
          if n != 1:
              raise SystemExit("Could not find hidden wireless_card")
          abi_pat = r'abiFilters\s+"armeabi-v7a",\s+"arm64-v8a"'
          s3, n2 = re.subn(abi_pat, 'abiFilters "arm64-v8a"', s2, count=1)
          if n2 != 1:
              raise SystemExit("Could not narrow ABI filters for CI build")
          p.write_text(s3)
          print("Wireless card exposed.")

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          ls -la "$ANDROID_HOME" || true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Bootstrap vcpkg
        working-directory: LibAuto
        run: |
          mkdir -p third_party
          git clone https://github.com/microsoft/vcpkg.git third_party/vcpkg
          ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build installable compatibility debug APK
        working-directory: LibAuto
        run: |
          chmod +x gradlew
          ./gradlew assembleCompatibilityDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          APK=$(find LibAuto/app/build/outputs/apk/compatibility/debug -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" output/LibAuto-wireless-test.apk
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibAuto-wireless-test
          path: output/LibAuto-wireless-test.apk
          if-no-files-found: error
